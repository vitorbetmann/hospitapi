services:
  postgres:
    image: postgres:18-alpine
    container_name: hospitapi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hospitapi}
      POSTGRES_USER: ${POSTGRES_USER:-hospitapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospitapi}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18+ : mount at /var/lib/postgresql, NOT /var/lib/postgresql/data
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: hospitapi-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-hospitapi}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-hospitapi}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  rabbitmqdata: