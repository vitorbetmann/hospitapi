spring.application.name=hospitapi-scheduling
server.port=8080
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hospitapi}
spring.datasource.username=${DB_USERNAME:hospitapi}
spring.datasource.password=${DB_PASSWORD:hospitapi}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:hospitapi}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:hospitapi}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
